x-runtime: &runtime
  image: rag-eval-platform:local
  build: .
  env_file: .env
  environment:
    DATABASE_URL: sqlite:////app/runtime/platform.db
    MYSQL_HOST: ''
    PROVIDER_MODE: demo
  volumes:
    - rag_runtime:/app/runtime

services:
  init:
    <<: *runtime
    command: [python, -m, app.seed]
  api:
    <<: *runtime
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:8010:8010'
    restart: unless-stopped
  worker:
    <<: *runtime
    command: [python, -m, app.worker]
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  rag_runtime:
